<!-- Messages side panel -->
<div id="messages-panel" aria-hidden="true" style="display:none; position:fixed; right:0; top:0; height:100%; width:360px; max-width:100%; background:#f7f7f8; box-shadow:-4px 0 12px rgba(0,0,0,0.15); z-index:1000; font-family:Arial,Helvetica,sans-serif;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e0e0e0;">
    <strong>Nachrichten</strong>
    <div>
      <button id="messages-close" aria-label="Schließen" style="background:transparent;border:0;cursor:pointer;font-size:18px;">✕</button>
    </div>
  </div>
  <div id="messages-content" style="display:flex;flex-direction:column;height:calc(100% - 56px);">
    <div id="chat-list" style="overflow:auto;padding:10px;border-right:1px solid #eee;">
      <!-- list of chats will be injected here -->
    </div>
    <div id="chat-window" style="flex:1;display:flex;flex-direction:column;border-top:1px solid #eaeaea;">
      <div id="chat-messages" style="flex:1;overflow:auto;padding:10px;background:#fff;"></div>
      <div style="padding:8px;border-top:1px solid #ddd;display:flex;gap:8px;">
        <input id="chat-input" aria-label="Nachricht eingeben" type="text" placeholder="Nachricht schreiben..." style="flex:1;padding:8px;border:1px solid #ccc;border-radius:4px;" />
        <button id="chat-send" style="padding:8px 10px;border-radius:4px;background:#2b7cff;color:#fff;border:0;cursor:pointer;">Senden</button>
      </div>
    </div>
  </div>
</div>

<!-- New Post Modal (UI only) -->
<div id="new-post-modal" class="new-post-modal-overlay" aria-hidden="true" style="display:none;">
  <div class="new-post-modal" role="dialog" aria-modal="true" aria-labelledby="new-post-title" style="max-width:880px;width:92%;background:#fff;border-radius:8px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,0.32);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h2 id="new-post-title" style="margin:0;font-size:20px;">Neuen Beitrag erstellen</h2>
      <button id="new-post-close" aria-label="Schließen" style="background:transparent;border:0;font-size:20px;cursor:pointer;">✕</button>
    </div>
    <form id="new-post-form">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <input id="post-title" aria-label="Beitrag Titel" name="title" placeholder="Titel (optional)" style="padding:10px;border:1px solid #ddd;border-radius:6px;font-size:16px;" />
        <textarea id="post-content" aria-label="Beitrag Inhalt" name="content" placeholder="Was möchtest du teilen?" rows="8" style="padding:10px;border:1px solid #ddd;border-radius:6px;font-size:15px;resize:vertical;"></textarea>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button type="button" id="new-post-cancel" style="padding:8px 12px;border-radius:6px;border:1px solid #ccc;background:transparent;cursor:pointer;">Abbrechen</button>
          <button type="submit" id="new-post-submit" style="padding:8px 12px;border-radius:6px;background:#2b7cff;color:#fff;border:0;cursor:pointer;">Beitrag hinzufügen</button>
        </div>
      </div>
    </form>
  </div>
</div>
