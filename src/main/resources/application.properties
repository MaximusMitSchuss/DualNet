spring.application.name=demoDualNet

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JPA / H2 dev settings
spring.datasource.url=jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# show sql for development
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.mode=HTML

# Server port: 0 lets the OS choose a free port, we'll read it from logs
server.port=8085

# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
